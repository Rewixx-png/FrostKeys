name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-signed-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: versionCode is the git commit count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package no longer exists in the SDK repo.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/frostkeys-release.jks"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/frostkeys-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/signature.txt
          CERT=$(awk '/SHA-256 digest/{print tolower($NF); exit}' /tmp/signature.txt)
          echo "signer SHA-256: $CERT"
          test "$CERT" = "f92cc057dc82ed221e8b6845b3d1b064c7cb4576aa24e12c76fdf26d4af49d94"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostKeys-signed-release
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest signed build" --notes "Automated signed build."
          gh release upload latest "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "Signed build from commit $GITHUB_SHA (run $GITHUB_RUN_NUMBER)."
